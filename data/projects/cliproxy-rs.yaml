name: cliproxy-rs
repo: https://github.com/vayungodara/cliproxy-rs
tagline: Several providers and API keys behind one local endpoint for OpenCode, with retry on another key after a 429
description: A Rust port of CLIProxyAPI. OpenCode points at it as an OpenAI-compatible custom provider. It translates to the Anthropic, OpenAI and Gemini APIs, spreads requests across the API keys you configure and retries on another key when one returns 429. Reads CLIProxyAPI's config and auth files. MIT.
